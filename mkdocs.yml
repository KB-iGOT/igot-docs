# Optional: renders this tree as a static site with `pip install mkdocs-material && mkdocs serve`
# The markdown is vanilla CommonMark + Mermaid, so it also renders on GitHub
# and can be dropped into Astro Starlight / Docusaurus unchanged.
site_name: iGOT Karmayogi Platform Documentation
theme:
  name: material
  palette:
    primary: indigo
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
