# Rebuilds the Docs Explorer from docs/ and publishes it to GitHub Pages as the site's index.
# One-time: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'karmayogi-docs-explorer.template.html'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docs Explorer as index.html
        run: |
          mkdir -p site
          python3 tools/build_docs_explorer.py --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
